<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MarkG Automations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b0f14 0%, #121823 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #121823;
            border-radius: 24px;
            padding: 40px;
            border: 1px solid #25313f;
            width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .logo-icon i {
            font-size: 2em;
            color: #0b0f14;
        }
        .logo h2 {
            font-size: 1.5em;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            color: #8a9db0;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #1b2736;
            border: 1px solid #25313f;
            border-radius: 12px;
            color: #e7eef6;
            font-size: 1em;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4ecdc4;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            border: none;
            border-radius: 12px;
            color: #0b0f14;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #8a9db0;
            text-decoration: none;
            font-size: 0.9em;
        }
        .back-link a:hover {
            color: #4ecdc4;
        }
        .alert {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
        }
        .alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-cog"></i>
            </div>
            <h2>Clinic Admin Portal</h2>
        </div>
        
        <div id="alert" class="alert"></div>
        
        <form id="adminLoginForm" onsubmit="event.preventDefault(); adminLogin();">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                Login to Admin Portal
            </button>
        </form>
        
        <div class="back-link">
            <a href="index.html">← Back to Patient Portal</a>
        </div>
    </div>

    <script>
        // Same Google Sheets config as your patient portal
        const SHEET_ID = '1FcDVXIz7Q5PmNhnSshmt8n4Z3k6P2fX0Puhmmh6y5dk';
        const API_KEY = 'AIzaSyDGMuppJQrS0DUl4XqMrR3e-nrWwdZVF5E';
        const ADMIN_SHEET = 'ADMINS';  // Your sheet name - must match exactly!

        async function adminLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const alertDiv = document.getElementById('alert');
            
            if (!username || !password) {
                showAlert('Please enter both username and password', 'error');
                return;
            }
            
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
            loginBtn.disabled = true;
            
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${ADMIN_SHEET}?key=${API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!data.values || data.values.length === 0) {
                    showAlert('Admin sheet not found. Please contact support.', 'error');
                    return;
                }
                
                const rows = data.values.slice(1);
                let isValid = false;
                let adminRole = '';
                
                for (const row of rows) {
                    const storedUsername = row[0] || '';
                    const storedPassword = row[1] || '';
                    const role = row[2] || 'Admin';
                    
                    if (storedUsername === username && storedPassword === password) {
                        isValid = true;
                        adminRole = role;
                        break;
                    }
                }
                
                if (isValid) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    localStorage.setItem('adminUsername', username);
                    localStorage.setItem('adminRole', adminRole);
                    
                    showAlert('Login successful! Redirecting...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    showAlert('Invalid username or password', 'error');
                }
                
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Unable to connect. Please try again.', 'error');
            } finally {
                loginBtn.innerHTML = 'Login to Admin Portal';
                loginBtn.disabled = false;
            }
        }
        
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.style.background = type === 'error' ? 'rgba(255, 107, 107, 0.1)' : 'rgba(78, 205, 196, 0.1)';
            alertDiv.style.borderColor = type === 'error' ? '#ff6b6b' : '#4ecdc4';
            alertDiv.style.color = type === 'error' ? '#ff6b6b' : '#4ecdc4';
            alertDiv.classList.add('show');
            
            setTimeout(() => {
                alertDiv.classList.remove('show');
            }, 3000);
        }
        
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin-dashboard.html';
        }
    </script>
</body>
</html>
