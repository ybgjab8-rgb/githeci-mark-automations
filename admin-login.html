<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MarkG Automations</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b0f14 0%, #121823 100%);
            color: #e7eef6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .login-container {
            background: rgba(11, 15, 20, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #25313f;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5em;
            color: #0b0f14;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.3);
        }

        .login-header h1 {
            font-size: 1.8em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .login-header p {
            color: #8a9db0;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #8a9db0;
            font-weight: 500;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-label i {
            color: #4ecdc4;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #1b2736;
            border: 1px solid #25313f;
            border-radius: 10px;
            color: #e7eef6;
            font-family: 'Inter', sans-serif;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.1);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            border: none;
            border-radius: 10px;
            color: #0b0f14;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(78, 205, 196, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9em;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: #4ecdc4;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: #45b7d1;
        }

        .demo-info {
            background: rgba(78, 205, 196, 0.05);
            border-left: 3px solid #4ecdc4;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85em;
            text-align: left;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #25313f;
        }

        .demo-info p {
            color: #8a9db0;
            margin-bottom: 8px;
        }

        .demo-info strong {
            color: #4ecdc4;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(78, 205, 196, 0.3);
            border-radius: 50%;
            border-top-color: #4ecdc4;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Admin Portal</h1>
            <p>Clinic Management Dashboard</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="adminLoginForm" onsubmit="adminLogin(event)">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-building"></i>
                    Clinic ID
                </label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="clinicId" 
                    placeholder="e.g., CLINIC001" 
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-key"></i>
                    Admin Password
                </label>
                <input 
                    type="password" 
                    class="form-input" 
                    id="adminPassword" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Access Dashboard</span>
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i> Back to Main Site
            </a>
        </div>

        <div class="demo-info">
            <p><strong>Demo Credentials:</strong></p>
            <div><strong>Clinic ID:</strong> CLINIC001</div>
            <div><strong>Password:</strong> admin123</div>
        </div>
    </div>

    <script>
        // Demo credentials for testing
        const VALID_CLINICS = {
            'CLINIC001': 'admin123',
            'CLINIC002': 'admin123'
        };

        async function adminLogin(event) {
            event.preventDefault();

            const clinicId = document.getElementById('clinicId').value.trim();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            errorMsg.classList.remove('show');

            if (!clinicId || !password) {
                showError('Please enter both clinic ID and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';

            try {
                await new Promise(resolve => setTimeout(resolve, 800));

                if (VALID_CLINICS[clinicId] && VALID_CLINICS[clinicId] === password) {
                    const token = btoa(`${clinicId}:${Date.now()}`);
                    localStorage.setItem('adminToken', token);
                    localStorage.setItem('clinicId', clinicId);
                    
                    setTimeout(() => {
                        window.location.href = 'admin-portal.html';
                    }, 500);
                } else {
                    throw new Error('Invalid clinic ID or password');
                }

            } catch (error) {
                showError(error.message);
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Access Dashboard</span>';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorMsg.classList.add('show');
        }

        function checkExistingLogin() {
            const token = localStorage.getItem('adminToken');
            const clinicId = localStorage.getItem('clinicId');

            if (token && clinicId) {
                window.location.href = 'admin-portal.html';
            }
        }

        document.addEventListener('DOMContentLoaded', checkExistingLogin);

        document.getElementById('clinicId').addEventListener('focus', () => {
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.getElementById('adminPassword').addEventListener('focus', () => {
            document.getElementById('errorMessage').classList.remove('show');
        });
    </script>
</body>
</html>
